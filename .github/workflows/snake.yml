name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A855F7&color_dots=%23161B22,%23312E81,%234F46E5,%237C3AED,%23A855F7

      - name: Generate contribution activity chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          query = 'query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}'
          body = json.dumps({"query": query, "variables": {"login": os.environ["GH_USER"]}}).encode()
          req = urllib.request.Request("https://api.github.com/graphql", data=body, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Content-Type": "application/json"})
          data = json.load(urllib.request.urlopen(req))
          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
          days = [day for week in weeks for day in week["contributionDays"]][-364:]
          values = [day["contributionCount"] for day in days]
          peak = max(values) or 1
          points = " ".join(f"{i * 900 / (len(values)-1):.1f},{125 - v / peak * 100:.1f}" for i, v in enumerate(values))
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" role="img" aria-labelledby="title desc"><title id="title">GitHub contribution activity</title><desc id="desc">Daily contributions over the past year</desc><rect width="900" height="160" rx="12" fill="#0d1117"/><text x="0" y="20" fill="#c9d1d9" font-family="sans-serif" font-size="14">Daily contributions · past year</text><polyline fill="none" stroke="#a78bfa" stroke-width="2" points="{points}"/></svg>'''
          os.makedirs("dist", exist_ok=True)
          open("dist/contribution-activity.svg", "w").write(svg)
          PY

      - name: Publish snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
